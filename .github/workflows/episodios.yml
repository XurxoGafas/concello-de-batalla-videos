# Genera episodios de la serie automáticamente (3 al día) y los deja en un borrador de release privado.
# · Semilla: Secret del repositorio `SEMILLA_SERIE` (nunca en el código, regla g).
# · Vídeo + portada: release en BORRADOR `episodio-NNN` (solo lo ven quienes tienen acceso de escritura; no se
#   publica nada, regla h). El usuario lo descarga y lo sube a mano a las redes.
# · Estado de la partida: se hace commit de `data/partida/` y `docs/EPISODIOS.md` tras cada episodio.
# · Al terminar la serie, las ejecuciones acaban sin hacer nada.
name: Episodios

on:
  schedule:
    - cron: "41 6,14,22 * * *"   # UTC → 7:41, 15:41 y 23:41 en Madrid (invierno)
  workflow_dispatch:
    inputs:
      cuantos:
        description: "Episodios seguidos a generar"
        default: "1"

concurrency:
  group: serie
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episodio:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config

      - name: Dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar episodios
        env:
          SEMILLA_SERIE: ${{ secrets.SEMILLA_SERIE }}
        run: |
          test -n "$SEMILLA_SERIE" || { echo "Falta el Secret SEMILLA_SERIE"; exit 1; }
          python -m src.render.serie "${{ inputs.cuantos || '1' }}"

      - name: Subir vídeos a borradores de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for v in output/episodios/episodio_*.mp4; do
            n=$(basename "$v" .mp4); n=${n#episodio_}
            notas=$(awk "/^## Episodio $((10#$n))\$/{p=1;next} /^## Episodio /{p=0} p" docs/EPISODIOS.md)
            gh release create "episodio-$n" --draft --target "$GITHUB_SHA" --title "Episodio $((10#$n))" \
              --notes "$notas" "$v" "output/episodios/episodio_${n}_portada.png"
          done

      - name: Guardar el estado de la partida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/partida docs/EPISODIOS.md
          git diff --cached --quiet && exit 0
          git commit -m "Episodio $(python -c 'import json;print(json.load(open("data/partida/estado_actual.json"))["episodio"])') (automático)"
          git push
